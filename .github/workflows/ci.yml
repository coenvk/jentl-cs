# Builds and tests every push; on a version tag (v0.2.0) packs every library and the asset tool with that version
# and publishes them to GitHub Packages.
name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Test
        run: dotnet test Jentl.slnx

      - name: Pack
        if: startsWith(github.ref, 'refs/tags/v')
        run: dotnet pack Jentl.slnx -c Release -p:Version=${GITHUB_REF_NAME#v}

      - name: Publish to GitHub Packages
        if: startsWith(github.ref, 'refs/tags/v')
        run: >
          dotnet nuget push "artifacts/packages/*.nupkg"
          --source https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json
          --api-key ${{ secrets.GITHUB_TOKEN }}
          --skip-duplicate
